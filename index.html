<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch People Live - Canlı Sohbet & Akış</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#111726',
                        accentOrange: '#f97316'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- İLK GİRİŞ: ADINI KOY MODALI -->
    <div id="nameModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-cardBg w-full max-w-sm rounded-2xl border border-slate-800 p-6 shadow-2xl space-y-4 text-center">
            <div class="w-12 h-12 bg-orange-500/10 text-orange-400 rounded-full flex items-center justify-center mx-auto text-xl border border-orange-500/20">
                <i class="fa-solid fa-user-tag"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-white">Adını Koy</h2>
                <p class="text-xs text-slate-400 mt-1">Sohbete katılmak için bir rumuz yaz.</p>
            </div>
            
            <div class="space-y-3">
                <input type="text" id="nicknameInput" maxlength="20" placeholder="İsmin..." class="w-full bg-darkBg border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-orange-500 text-center font-medium">
                <button onclick="setMyName()" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2.5 rounded-xl text-sm font-semibold shadow-lg shadow-orange-500/20 transition-colors">Sohbete Başla</button>
            </div>
        </div>
    </div>

    <!-- ANA UYGULAMA -->
    <div id="appScreen" class="flex-1 flex flex-col max-w-5xl w-full mx-auto">
        <!-- Header -->
        <header class="bg-cardBg border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <span class="font-bold text-orange-400 text-lg flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> WPL Live
            </span>
            <div class="flex items-center space-x-3">
                <span id="myDisplayName" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-700 font-semibold">...</span>
                <button onclick="changeName()" class="text-xs text-slate-400 hover:text-orange-400" title="İsim Değiştir"><i class="fa-solid fa-pen-to-square"></i></button>
            </div>
        </header>

        <!-- İçerik Alanı -->
        <div class="flex-1 flex overflow-hidden">
            
            <!-- SOL: Aktif Kişiler & Arama -->
            <aside class="w-1/3 border-r border-slate-800 bg-cardBg/30 flex flex-col">
                <div class="p-3 border-b border-slate-800">
                    <input type="text" id="searchInput" oninput="filterUsers()" placeholder="Kişi ara..." class="w-full bg-darkBg border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-orange-500">
                </div>
                <div class="p-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Aktif Cihazlar / Kişiler</div>
                <div id="usersList" class="flex-1 overflow-y-auto divide-y divide-slate-800/40 p-2 text-sm"></div>
            </aside>

            <!-- SAĞ ORTA: Sohbet / Post Tab -->
            <main class="flex-1 flex flex-col bg-darkBg">
                <!-- Tab Butonları -->
                <div class="flex border-b border-slate-800 bg-cardBg/60">
                    <button onclick="switchTab('chat')" id="tabChatBtn" class="flex-1 py-2.5 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-comments"></i> Özel Sohbet
                    </button>
                    <button onclick="switchTab('feed')" id="tabFeedBtn" class="flex-1 py-2.5 text-xs font-semibold text-slate-400 hover:text-slate-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-layer-group"></i> Canlı Akış / Post
                    </button>
                </div>

                <!-- TAB 1: SOHBET -->
                <div id="chatTab" class="flex-1 flex flex-col">
                    <div id="chatHeader" class="p-3 bg-cardBg/80 border-b border-slate-800 text-xs font-bold text-slate-300 hidden">
                        Sohbet Edilen: <span id="chatTargetName" class="text-orange-400"></span>
                    </div>

                    <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col justify-center items-center text-slate-600 text-xs">
                        Soldan aktif bir kullanıcı seçerek mesajlaşmaya başla.
                    </div>

                    <form id="chatForm" onsubmit="sendChatMessage(event)" class="p-3 bg-cardBg border-t border-slate-800 hidden flex items-center gap-2">
                        <label class="text-slate-400 hover:text-orange-400 cursor-pointer p-2" title="Medya Çek">
                            <i class="fa-solid fa-camera text-base"></i>
                            <input type="file" accept="image/*,video/*" capture="environment" class="hidden" onchange="sendChatMedia(this)">
                        </label>
                        <input type="text" id="chatMsgInput" placeholder="Mesaj yaz..." class="flex-1 bg-darkBg border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-orange-500">
                        <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white px-3 py-2 rounded-xl text-xs font-semibold"><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                </div>

                <!-- TAB 2: AKIŞ -->
                <div id="feedTab" class="flex-1 flex flex-col hidden overflow-y-auto p-4 space-y-4">
                    <div class="bg-cardBg rounded-2xl p-4 border border-slate-800 space-y-3">
                        <textarea id="postTextInput" rows="2" placeholder="Neler oluyor?..." class="w-full bg-darkBg border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-orange-500 resize-none"></textarea>
                        
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <label class="text-xs text-slate-400 hover:text-orange-400 cursor-pointer flex items-center gap-1.5 bg-darkBg border border-slate-800 px-3 py-1.5 rounded-xl">
                                    <i class="fa-solid fa-camera text-orange-400"></i> Kamera / Medya
                                    <input type="file" accept="image/*,video/*" capture="environment" class="hidden" onchange="previewPostMedia(this)">
                                </label>
                                <label class="flex items-center gap-1.5 text-xs text-slate-400 cursor-pointer">
                                    <input type="checkbox" id="postAnonCheck" class="rounded bg-darkBg border-slate-800 text-orange-500 focus:ring-0">
                                    Anonim
                                </label>
                            </div>
                            <button onclick="submitPost()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-1.5 rounded-xl text-xs font-semibold">Paylaş</button>
                        </div>
                        <div id="postMediaPreviewArea" class="hidden relative w-full h-32 rounded-lg overflow-hidden border border-slate-700 bg-black flex items-center justify-center">
                            <img id="postImgPreview" src="" class="w-full h-full object-cover hidden">
                            <video id="postVideoPreview" src="" controls class="w-full h-full object-cover hidden"></video>
                        </div>
                    </div>

                    <div id="postsContainer" class="space-y-3"></div>
                </div>

            </main>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD1AeurYNk8VA1Gm9UGek13PWbFXGAPU1g",
          authDomain: "watchppllive.firebaseapp.com",
          projectId: "watchppllive",
          storageBucket: "watchppllive.firebasestorage.app",
          messagingSenderId: "1015771032346",
          appId: "1:1015771032346:web:fb1f156496367f93fb1aa3",
          measurementId: "G-KWV7387RTV"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myName = '';
        let activeTargetUser = null;
        let activeUsersCache = [];
        let postMediaData = { url: '', type: '' };

        window.onload = () => {
            const saved = localStorage.getItem('wpl_nickname');
            if (saved) {
                myName = saved;
                document.getElementById('nameModal').classList.add('hidden');
                initApp();
            }
        };

        function setMyName() {
            const input = document.getElementById('nicknameInput').value.trim();
            if (!input) {
                alert("Lütfen bir isim yaz!");
                return;
            }
            myName = input;
            localStorage.setItem('wpl_nickname', myName);
            document.getElementById('nameModal').classList.add('hidden');
            initApp();
        }

        function changeName() {
            localStorage.removeItem('wpl_nickname');
            location.reload();
        }

        function initApp() {
            document.getElementById('myDisplayName').innerText = myName;
            
            // Aktif kullanıcı olarak kaydet ve her 30 saniyede bir güncelle
            updateActiveStatus();
            setInterval(updateActiveStatus, 30000);

            listenActiveUsers();
            listenPosts();
        }

        function updateActiveStatus() {
            if (!myName) return;
            db.collection("active_users").doc(myName).set({
                name: myName,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function listenActiveUsers() {
            // Son 1 dakika içinde aktif olanları filtrele
            db.collection("active_users").onSnapshot((snap) => {
                activeUsersCache = [];
                const now = Date.now();
                snap.forEach(doc => {
                    const u = doc.data();
                    if (u.name !== myName) {
                        // Basitçe tüm aktif kaydedilenleri listele
                        activeUsersCache.push(u.name);
                    }
                });
                renderUsers(activeUsersCache);
            });
        }

        function renderUsers(list) {
            const container = document.getElementById('usersList');
            let html = '';
            list.forEach(u => {
                html += `
                    <div onclick="selectChatTarget('${u}')" class="p-2.5 hover:bg-slate-800/60 cursor-pointer rounded-xl flex items-center justify-between transition-colors">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span class="font-medium text-slate-200">${u}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                    </div>
                `;
            });
            container.innerHTML = html || `<div class="text-xs text-slate-600 p-2">Aktif kimse yok.</div>`;
        }

        function filterUsers() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderUsers(activeUsersCache.filter(u => u.toLowerCase().includes(q)));
        }

        function switchTab(tab) {
            if (tab === 'chat') {
                document.getElementById('chatTab').classList.remove('hidden');
                document.getElementById('feedTab').classList.add('hidden');
                document.getElementById('tabChatBtn').className = "flex-1 py-2.5 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center justify-center gap-2";
                document.getElementById('tabFeedBtn').className = "flex-1 py-2.5 text-xs font-semibold text-slate-400 hover:text-slate-200 flex items-center justify-center gap-2";
            } else {
                document.getElementById('chatTab').classList.add('hidden');
                document.getElementById('feedTab').classList.remove('hidden');
                document.getElementById('tabFeedBtn').className = "flex-1 py-2.5 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center justify-center gap-2";
                document.getElementById('tabChatBtn').className = "flex-1 py-2.5 text-xs font-semibold text-slate-400 hover:text-slate-200 flex items-center justify-center gap-2";
            }
        }

        function selectChatTarget(targetName) {
            activeTargetUser = targetName;
            document.getElementById('chatHeader').classList.remove('hidden');
            document.getElementById('chatForm').classList.remove('hidden');
            document.getElementById('chatTargetName').innerText = targetName;
            listenMessages();
        }

        function getRoomId(u1, u2) { return u1 < u2 ? `${u1}_${u2}` : `${u2}_${u1}`; }

        function listenMessages() {
            const roomId = getRoomId(myName, activeTargetUser);
            db.collection("chats").doc(roomId).collection("messages")
                .orderBy("createdAt", "asc")
                .onSnapshot((snap) => {
                    const box = document.getElementById('chatMessages');
                    let html = '';
                    snap.forEach(doc => {
                        const m = doc.data();
                        const isMe = m.sender === myName;
                        let content = `<p>${m.text || ''}</p>`;
                        if (m.type === 'img') content = `<img src="${m.url}" class="rounded-lg max-w-[180px]">`;
                        if (m.type === 'video') content = `<video src="${m.url}" controls class="rounded-lg max-w-[180px]"></video>`;

                        html += `
                            <div class="w-full flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1">
                                <div class="${isMe ? 'bg-orange-500 text-white' : 'bg-slate-800 text-slate-200'} px-3 py-2 rounded-2xl max-w-[80%] text-xs shadow">
                                    ${content}
                                </div>
                            </div>
                        `;
                    });
                    box.className = "flex-1 p-4 overflow-y-auto space-y-2 flex flex-col";
                    box.innerHTML = html || `<div class="text-xs text-slate-600 text-center my-auto">Sohbeti başlat...</div>`;
                    box.scrollTop = box.scrollHeight;
                });
        }

        async function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chatMsgInput');
            const txt = input.value.trim();
            if (!txt || !activeTargetUser) return;
            input.value = '';

            const roomId = getRoomId(myName, activeTargetUser);
            await db.collection("chats").doc(roomId).collection("messages").add({
                sender: myName,
                text: txt,
                type: 'text',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function sendChatMedia(input) {
            if (!input.files || !input.files[0] || !activeTargetUser) return;
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = async (e) => {
                const roomId = getRoomId(myName, activeTargetUser);
                const isVideo = file.type.startsWith('video');
                await db.collection("chats").doc(roomId).collection("messages").add({
                    sender: myName,
                    url: e.target.result,
                    type: isVideo ? 'video' : 'img',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            };
            reader.readAsDataURL(file);
        }

        function previewPostMedia(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                postMediaData.url = e.target.result;
                postMediaData.type = file.type.startsWith('video') ? 'video' : 'img';
                
                const previewArea = document.getElementById('postMediaPreviewArea');
                const imgPrev = document.getElementById('postImgPreview');
                const vidPrev = document.getElementById('postVideoPreview');
                
                previewArea.classList.remove('hidden');
                if (postMediaData.type === 'video') {
                    vidPrev.src = postMediaData.url;
                    vidPrev.classList.remove('hidden');
                    imgPrev.classList.add('hidden');
                } else {
                    imgPrev.src = postMediaData.url;
                    imgPrev.classList.remove('hidden');
                    vidPrev.classList.add('hidden');
                }
            };
            reader.readAsDataURL(file);
        }

        async function submitPost() {
            const txt = document.getElementById('postTextInput').value.trim();
            const isAnon = document.getElementById('postAnonCheck').checked;

            if (!txt && !postMediaData.url) return;

            await db.collection("posts").add({
                author: isAnon ? "Anonim" : myName,
                text: txt,
                mediaUrl: postMediaData.url,
                mediaType: postMediaData.type,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById('postTextInput').value = '';
            document.getElementById('postAnonCheck').checked = false;
            document.getElementById('postMediaPreviewArea').classList.add('hidden');
            postMediaData = { url: '', type: '' };
        }

        function listenPosts() {
            db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snap) => {
                const container = document.getElementById('postsContainer');
                let html = '';
                snap.forEach(doc => {
                    const p = doc.data();
                    let mediaHtml = '';
                    if (p.mediaType === 'img') {
                        mediaHtml = `<img src="${p.mediaUrl}" class="rounded-xl max-h-60 w-full object-cover">`;
                    } else if (p.mediaType === 'video') {
                        mediaHtml = `<video src="${p.mediaUrl}" controls class="rounded-xl max-h-60 w-full object-cover"></video>`;
                    }

                    html += `
                        <div class="bg-cardBg p-4 rounded-2xl border border-slate

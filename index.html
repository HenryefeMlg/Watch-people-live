<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch People Live - Akış & Sohbet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#111726',
                        accentOrange: '#f97316'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen font-sans flex flex-col justify-between">

    <div id="appScreen" class="flex-1 flex flex-col max-w-5xl w-full mx-auto pb-16 md:pb-0">
        <!-- Header -->
        <header class="bg-cardBg border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
            <span class="font-bold text-orange-400 text-lg flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> WPL Live
            </span>
            <div class="flex items-center space-x-3">
                <span id="myDisplayName" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-700 font-semibold truncate max-w-[120px]">...</span>
                <button onclick="changeName()" class="text-xs text-slate-400 hover:text-orange-400 bg-slate-800/50 px-2.5 py-1.5 rounded-xl border border-slate-700" title="İsim Değiştir">
                    <i class="fa-solid fa-pen-to-square"></i> <span class="hidden sm:inline">Adı Değiştir</span>
                </button>
            </div>
        </header>

        <!-- İçerik Alanı -->
        <div class="flex-1 flex overflow-hidden">
            
            <!-- SOL: Aktif Kişiler (Mobilde Sekme Olarak Değişir) -->
            <aside id="usersSidebar" class="hidden md:flex w-full md:w-1/3 border-r border-slate-800 bg-cardBg/30 flex-col">
                <div class="p-3 border-b border-slate-800">
                    <input type="text" id="searchInput" oninput="filterUsers()" placeholder="Kişi ara..." class="w-full bg-darkBg border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-orange-500">
                </div>
                <div class="p-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Aktif Kişiler</div>
                <div id="usersList" class="flex-1 overflow-y-auto divide-y divide-slate-800/40 p-2 text-sm"></div>
            </aside>

            <!-- SAĞ: Akış & Sohbet -->
            <main id="mainContent" class="flex-1 flex flex-col bg-darkBg w-full">
                <!-- Masaüstü Sekme Butonları -->
                <div class="hidden md:flex border-b border-slate-800 bg-cardBg/60">
                    <button onclick="switchTab('feed')" id="tabFeedBtn" class="flex-1 py-2.5 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-layer-group"></i> Canlı Akış / Post
                    </button>
                    <button onclick="switchTab('chat')" id="tabChatBtn" class="flex-1 py-2.5 text-xs font-semibold text-slate-400 hover:text-slate-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-comments"></i> Özel Sohbet
                    </button>
                </div>

                <!-- TAB 1: AKIŞ -->
                <div id="feedTab" class="flex-1 flex flex-col overflow-y-auto p-3 md:p-4 space-y-4">
                    <!-- Post Paylaşım Kutusu -->
                    <div class="bg-cardBg rounded-2xl p-3 md:p-4 border border-slate-800 space-y-3">
                        <textarea id="postTextInput" rows="2" placeholder="Neler oluyor?..." class="w-full bg-darkBg border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-orange-500 resize-none"></textarea>
                        
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div class="flex items-center gap-2 sm:gap-3">
                                <label class="text-xs text-slate-400 hover:text-orange-400 cursor-pointer flex items-center gap-1.5 bg-darkBg border border-slate-800 px-3 py-2 rounded-xl active:scale-95 transition-transform">
                                    <i class="fa-solid fa-camera text-orange-400"></i> Medya Çek/Yükle
                                    <input type="file" id="postFileInput" accept="image/*,video/*" capture="environment" class="hidden" onchange="previewPostMedia(this)">
                                </label>
                                <label class="flex items-center gap-1.5 text-xs text-slate-400 cursor-pointer select-none">
                                    <input type="checkbox" id="postAnonCheck" class="rounded bg-darkBg border-slate-800 text-orange-500 focus:ring-0 w-4 h-4">
                                    Anonim
                                </label>
                            </div>
                            <button onclick="submitPost()" class="bg-orange-500 hover:bg-orange-600 active:scale-95 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-orange-500/20 transition-all">Paylaş</button>
                        </div>
                        
                        <div id="postMediaPreviewArea" class="hidden relative w-full h-40 rounded-lg overflow-hidden border border-slate-700 bg-black flex items-center justify-center">
                            <img id="postImgPreview" src="" class="w-full h-full object-cover hidden">
                            <video id="postVideoPreview" src="" controls class="w-full h-full object-cover hidden"></video>
                            <button onclick="clearPostMedia()" class="absolute top-2 right-2 bg-black/70 text-white w-7 h-7 rounded-full text-xs flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>

                    <!-- Postlar -->
                    <div id="postsContainer" class="space-y-4"></div>
                </div>

                <!-- TAB 2: SOHBET -->
                <div id="chatTab" class="flex-1 flex flex-col hidden">
                    <div id="chatHeader" class="p-3 bg-cardBg/80 border-b border-slate-800 text-xs font-bold text-slate-300 hidden flex items-center justify-between">
                        <div>Sohbet Edilen: <span id="chatTargetName" class="text-orange-400"></span></div>
                    </div>

                    <div id="chatMessages" class="flex-1 p-3 md:p-4 overflow-y-auto space-y-3 flex flex-col justify-center items-center text-slate-600 text-xs">
                        Aktif kişilerden birini seçerek sohbet başlat.
                    </div>

                    <form id="chatForm" onsubmit="sendChatMessage(event)" class="p-3 bg-cardBg border-t border-slate-800 hidden flex items-center gap-2">
                        <label class="text-slate-400 hover:text-orange-400 cursor-pointer p-2 active:scale-95">
                            <i class="fa-solid fa-camera text-lg"></i>
                            <input type="file" accept="image/*,video/*" capture="environment" class="hidden" onchange="sendChatMedia(this)">
                        </label>
                        <input type="text" id="chatMsgInput" placeholder="Mesaj yaz..." class="flex-1 bg-darkBg border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-orange-500">
                        <button type="submit" class="bg-orange-500 hover:bg-orange-600 active:scale-95 text-white px-3.5 py-2.5 rounded-xl text-xs font-semibold"><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                </div>

            </main>
        </div>
    </div>

    <!-- MOBİL ALT MENÜ (DOKUNMATİK TAB BAR) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-cardBg/95 backdrop-blur-lg border-t border-slate-800 flex items-center justify-around py-2 z-30">
        <button onclick="switchMobileView('feed')" id="mobFeedBtn" class="flex flex-col items-center gap-1 text-orange-400">
            <i class="fa-solid fa-layer-group text-lg"></i>
            <span class="text-[10px] font-semibold">Canlı Akış</span>
        </button>
        <button onclick="switchMobileView('users')" id="mobUsersBtn" class="flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-users text-lg"></i>
            <span class="text-[10px] font-semibold">Kişiler</span>
        </button>
        <button onclick="switchMobileView('chat')" id="mobChatBtn" class="flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-comments text-lg"></i>
            <span class="text-[10px] font-semibold">Sohbet</span>
        </button>
    </nav>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD1AeurYNk8VA1Gm9UGek13PWbFXGAPU1g",
          authDomain: "watchppllive.firebaseapp.com",
          projectId: "watchppllive",
          storageBucket: "watchppllive.firebasestorage.app",
          messagingSenderId: "1015771032346",
          appId: "1:1015771032346:web:fb1f156496367f93fb1aa3",
          measurementId: "G-KWV7387RTV"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myName = '';
        let activeTargetUser = null;
        let activeUsersCache = [];
        let postMediaData = { url: '', type: '' };

        window.onload = () => {
            let saved = localStorage.getItem('wpl_nickname');
            if (!saved) {
                saved = "Misafir_" + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem('wpl_nickname', saved);
            }
            myName = saved;
            initApp();
        };

        function changeName() {
            const newName = prompt("Yeni adını/rumuzunu gir:", myName);
            if (newName && newName.trim() !== "") {
                myName = newName.trim();
                localStorage.setItem('wpl_nickname', myName);
                location.reload();
            }
        }

        function initApp() {
            document.getElementById('myDisplayName').innerText = myName;
            updateActiveStatus();
            setInterval(updateActiveStatus, 30000);

            listenActiveUsers();
            listenPosts();
        }

        function updateActiveStatus() {
            if (!myName) return;
            db.collection("active_users").doc(myName).set({
                name: myName,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function listenActiveUsers() {
            db.collection("active_users").onSnapshot((snap) => {
                activeUsersCache = [];
                snap.forEach(doc => {
                    const u = doc.data();
                    if (u.name !== myName) activeUsersCache.push(u.name);
                });
                renderUsers(activeUsersCache);
            });
        }

        function renderUsers(list) {
            const container = document.getElementById('usersList');
            let html = '';
            list.forEach(u => {
                html += `
                    <div onclick="selectChatTarget('${u}')" class="p-3 hover:bg-slate-800/60 active:bg-slate-800 cursor-pointer rounded-xl flex items-center justify-between transition-colors">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span class="font-medium text-slate-200 text-xs sm:text-sm">${u}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                    </div>
                `;
            });
            container.innerHTML = html || `<div class="text-xs text-slate-600 p-3">Aktif kimse yok.</div>`;
        }

        function filterUsers() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderUsers(activeUsersCache.filter(u => u.toLowerCase().includes(q)));
        }

        /* --- MOBİL GEÇİŞ FONKSİYONLARI --- */
        function switchMobileView(view) {
            const usersSidebar = document.getElementById('usersSidebar');
            const mainContent = document.getElementById('mainContent');
            const mobFeedBtn = document.getElementById('mobFeedBtn');
            const mobUsersBtn = document.getElementById('mobUsersBtn');
            const mobChatBtn = document.getElementById('mobChatBtn');

            mobFeedBtn.className = "flex flex-col items-center gap-1 text-slate-400";
            mobUsersBtn.className = "flex flex-col items-center gap-1 text-slate-400";
            mobChatBtn.className = "flex flex-col items-center gap-1 text-slate-400";

            if (view === 'users') {
                usersSidebar.classList.remove('hidden');
                usersSidebar.classList.add('flex', 'w-full');
                mainContent.classList.add('hidden');
                mobUsersBtn.className = "flex flex-col items-center gap-1 text-orange-400";
            } else if (view === 'chat') {
                usersSidebar.classList.add('hidden');
                usersSidebar.classList.remove('flex', 'w-full');
                mainContent.classList.remove('hidden');
                switchTab('chat');
                mobChatBtn.className = "flex flex-col items-center gap-1 text-orange-400";
            } else {
                usersSidebar.classList.add('hidden');
                usersSidebar.classList.remove('flex', 'w-full');
                mainContent.classList.remove('hidden');
                switchTab('feed');
                mobFeedBtn.className = "flex flex-col items-center gap-1 text-orange-400";
            }
        }

        function switchTab(tab) {
            if (tab === 'feed') {
                document.getElementById('feedTab').classList.remove('hidden');
                document.getElementById('chatTab').classList.add('hidden');
                document.getElementById('tabFeedBtn').className = "flex-1 py-2.5 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center justify-center gap-2";
                document.getElementById('tabChatBtn').className = "flex-1 py-2.5 text-xs font-semibold text-slate-400 hover:text-slate-200 flex items-center justify-center gap-2";
            } else {
                document.getElementById('feedTab').classList.add('hidden');
                document.getElementById('chatTab').classList.remove('hidden');
                document.getElementById('tabChatBtn').className = "flex-1 py-2.5 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center justify-center gap-2";
                document.getElementById('tabFeedBtn').className = "flex-1 py-2.5 text-xs font-semibold text-slate-400 hover:text-slate-200 flex items-center justify-center gap-2";
            }
        }

        function previewPostMedia(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                postMediaData.url = e.target.result;
                postMediaData.type = file.type.startsWith('video') ? 'video' : 'img';
                
                const previewArea = document.getElementById('postMediaPreviewArea');
                const imgPrev = document.getElementById('postImgPreview');
                const vidPrev = document.getElementById('postVideoPreview');
                
                previewArea.classList.remove('hidden');
                if (postMediaData.type === 'video') {
                    vidPrev.src = postMediaData.url;
                    vidPrev.classList.remove('hidden');
                    imgPrev.classList.add('hidden');
                } else {
                    imgPrev.src = postMediaData.url;
                    imgPrev.classList.remove('hidden');
                    vidPrev.classList.add('hidden');
                }
            };
            reader.readAsDataURL(file);
        }

        function clearPostMedia() {
            postMediaData = { url: '', type: '' };
            document.getElementById('postFileInput').value = '';
            document.getElementById('postMediaPreviewArea').classList.add('hidden');
        }

        async function submitPost() {
            const txt = document.getElementById('postTextInput').value.trim();
            const isAnon = document.getElementById('postAnonCheck').checked;

            if (!txt && !postMediaData.url) return;

            await db.collection("posts").add({
                author: isAnon ? "Anonim" : myName,
                text: txt,
                mediaUrl: postMediaData.url,
                mediaType: postMediaData.type,
                likes: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById('postTextInput').value = '';
            document.getElementById('postAnonCheck').checked = false;
            clearPostMedia();
        }

        function listenPosts() {
            db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snap) => {
                const container = document.getElementById('postsContainer');
                let html = '';
                snap.forEach(doc => {
                    const postId = doc.id;
                    const p = doc.data();
                    const likes = p.likes || [];
                    const isLiked = likes.includes(myName);

                    let mediaHtml = '';
                    if (p.mediaType === 'img') {
                        mediaHtml = `<img src="${p.mediaUrl}" class="rounded-xl max-h-72 w-full object-cover">`;
                    } else if (p.mediaType === 'video') {
                        mediaHtml = `<video src="${p.mediaUrl}" controls class="rounded-xl max-h-72 w-full object-cover"></video>`;
                    }

                    html += `
                        <div class="bg-cardBg p-3.5 sm:p-4 rounded-2xl border border-slate-800 space-y-3">
                            <div class="flex items-center justify-between text-xs font-semibold text-orange-400">
                                <span>${p.author}</span>
                            </div>
                            ${p.text ? `<p class="text-xs text-slate-200 break-words">${escapeHtml(p.text)}</p>` : ''}
                            ${mediaHtml}

                            <div class="flex items-center gap-4 pt-2 border-t border-slate-800/60 text-xs">
                                <button onclick="toggleLike('${postId}', ${isLiked})" class="flex items-center gap-1.5 ${isLiked ? 'text-red-500 font-bold' : 'text-slate-400 hover:text-red-400'} transition-colors">
                                    <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart text-sm"></i>
                                    <span>${likes.length} Beğeni</span>
                                </button>
                                <button onclick="toggleComments('${postId}')" class="flex items-center gap-1.5 text-slate-400 hover:text-orange-400 transition-colors">
                                    <i class="fa-regular fa-comment text-sm"></i>


<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPL Live</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- PeerJS CDN for WebRTC Real-Time Voice Calling -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0e1626',
                            card: '#182236',
                            cardBorder: '#233047',
                            orange: '#f97316',
                            orangeHover: '#ea580c',
                            textMuted: '#94a3b8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0e1626;
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0e1626;
        }
        ::-webkit-scrollbar-thumb {
            background: #233047;
            border-radius: 9999px;
        }
        .like-heart {
            transition: transform 0.15s ease-in-out, color 0.15s ease-in-out;
        }
        .like-heart:active {
            transform: scale(1.35);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-animation {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between max-w-md mx-auto relative shadow-2xl bg-brand-dark">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-brand-dark/95 backdrop-blur-md border-b border-brand-cardBorder px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-bolt text-brand-orange text-xl animate-pulse"></i>
            <span class="font-bold text-xl tracking-tight text-white">WPL Live</span>
        </div>
        <div class="flex items-center space-x-2">
            <!-- PeerJS Status Badge -->
            <div id="peer-status-badge" class="flex items-center space-x-1 text-[11px] bg-brand-card px-2 py-1 rounded-full border border-brand-cardBorder text-gray-400">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                <span id="peer-status-text">Bağlanıyor...</span>
            </div>

            <!-- Username Box -->
            <div class="flex items-center bg-brand-card px-3 py-1.5 rounded-full border border-brand-cardBorder text-sm text-gray-200 shadow-inner space-x-1.5">
                <i class="fa-solid fa-user text-brand-orange text-xs"></i>
                <span id="current-username-display" class="font-medium text-xs">Misafir_6997</span>
                <button onclick="editUsername()" class="text-brand-textMuted hover:text-white transition-colors ml-1">
                    <i class="fa-solid fa-pen text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Info Bar -->
    <div id="storage-info-bar" class="bg-brand-card/60 px-4 py-1.5 border-b border-brand-cardBorder text-[11px] text-brand-textMuted flex justify-between items-center">
        <span class="flex items-center space-x-1.5">
            <i class="fa-solid fa-shield-halved text-brand-orange"></i>
            <span>WPL Live WebRTC Sesli İletişim</span>
        </span>
        <span id="storage-usage-stats" class="text-gray-400 font-mono">0 Gönderi</span>
    </div>

    <!-- Main Dynamic Content Container -->
    <main id="app-content" class="flex-1 px-4 py-4 space-y-4 overflow-y-auto pb-24">
        <!-- Content injected dynamically via JS based on active tab -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-brand-dark/95 backdrop-blur-md border-t border-brand-cardBorder px-6 py-2.5 flex justify-around items-center z-40">
        <button onclick="switchTab('feed')" id="nav-feed" class="flex flex-col items-center text-brand-orange transition-all">
            <i class="fa-solid fa-layer-group text-lg mb-1"></i>
            <span class="text-xs font-medium">Canlı Akış</span>
        </button>
        <button onclick="switchTab('contacts')" id="nav-contacts" class="flex flex-col items-center text-brand-textMuted hover:text-gray-200 transition-all">
            <i class="fa-solid fa-user-group text-lg mb-1"></i>
            <span class="text-xs font-medium">Kişiler</span>
        </button>
        <button onclick="switchTab('chat')" id="nav-chat" class="flex flex-col items-center text-brand-textMuted hover:text-gray-200 transition-all relative">
            <i class="fa-solid fa-comments text-lg mb-1"></i>
            <span class="text-xs font-medium">Sohbet</span>
            <span id="unread-badge" class="hidden absolute top-0 right-2 w-2 h-2 bg-brand-orange rounded-full"></span>
        </button>
    </nav>

    <!-- VOICE CALL OVERLAY MODAL -->
    <div id="voice-call-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-lg flex flex-col items-center justify-between p-8 text-center">
        <div class="pt-8">
            <div id="call-status-label" class="text-xs text-brand-orange font-bold uppercase tracking-widest mb-2">Sesli Arama</div>
            <h2 id="call-target-name" class="text-2xl font-bold text-white mb-1">Kullanıcı</h2>
            <p id="call-timer-label" class="text-sm text-brand-textMuted">Bağlanıyor...</p>
        </div>

        <!-- Avatar Ring Effect -->
        <div class="relative my-auto">
            <div id="call-ring-effect" class="w-32 h-32 rounded-full bg-brand-orange/20 border-2 border-brand-orange flex items-center justify-center pulse-animation">
                <div class="w-24 h-24 rounded-full bg-brand-card border border-brand-cardBorder flex items-center justify-center text-brand-orange text-4xl shadow-2xl">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </div>

        <!-- Call Actions / Controls -->
        <div class="w-full space-y-6 pb-6">
            <!-- Incoming Call Controls (Accept / Reject) -->
            <div id="incoming-call-actions" class="hidden flex justify-center space-x-12">
                <button onclick="rejectIncomingCall()" class="w-16 h-16 rounded-full bg-red-600 hover:bg-red-700 text-white flex items-center justify-center text-xl shadow-lg transition-transform active:scale-95">
                    <i class="fa-solid fa-phone-slash"></i>
                </button>
                <button onclick="acceptIncomingCall()" class="w-16 h-16 rounded-full bg-green-600 hover:bg-green-700 text-white flex items-center justify-center text-xl shadow-lg transition-transform active:scale-95 animate-bounce">
                    <i class="fa-solid fa-phone"></i>
                </button>
            </div>

            <!-- Active / Outgoing Call Controls -->
            <div id="active-call-actions" class="flex justify-center items-center space-x-8">
                <button onclick="toggleMuteMic()" id="mute-mic-btn" class="w-12 h-12 rounded-full bg-brand-card border border-brand-cardBorder text-gray-200 hover:text-brand-orange flex items-center justify-center text-lg transition-all active:scale-95">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button onclick="endCall()" class="w-16 h-16 rounded-full bg-red-600 hover:bg-red-700 text-white flex items-center justify-center text-xl shadow-lg transition-transform active:scale-95">
                    <i class="fa-solid fa-phone-slash"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden Remote Audio Player for WebRTC -->
    <audio id="remote-audio" autoplay class="hidden"></audio>

    <!-- Toast Notification Overlay -->
    <div id="toast-container" class="fixed top-14 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none w-full max-w-xs px-4"></div>

    <!-- JavaScript Application Logic -->
    <script>
        // Configs & Constants
        const MAX_POSTS = 50; // Main feed capacity limit (NOT deleted on timer)
        const PRIVATE_CHAT_PURGE_INTERVAL_SECONDS = 120; // 2 Minutes auto-clear for PRIVATE MESSAGES ONLY
        
        // App State
        let currentUser = localStorage.getItem('wpl_user') || 'Misafir_' + Math.floor(1000 + Math.random() * 9000);
        let currentTab = 'feed';
        let selectedChatContact = null;
        let secondsRemainingForPrivateChatPurge = PRIVATE_CHAT_PURGE_INTERVAL_SECONDS;

        // PeerJS & WebRTC State
        let peer = null;
        let peerId = null;
        let localStream = null;
        let currentCall = null;
        let isMicMuted = false;
        let incomingCallData = null;
        let callTimerInterval = null;
        let callDurationSeconds = 0;

        // Persistent App Data State
        let appData = {
            posts: JSON.parse(localStorage.getItem('wpl_posts')) || [
                {
                    id: 'post_1',
                    author: 'Misafir_6997',
                    text: 'Alo! Sesli arama özelliği aktif 📞 Özel sohbetten kişileri arayabilirsiniz.',
                    timestamp: Date.now() - 60000,
                    likes: 2,
                    likedBy: [],
                    media: null,
                    isAnonymous: false
                },
                {
                    id: 'post_2',
                    author: 'Anonim',
                    text: 'WPL Live canlı akışı kalıcıdır, sadece özel mesajlar 2 dakikada bir temizlenir. 🚀',
                    timestamp: Date.now() - (20008 * 86400 * 1000),
                    likes: 1,
                    likedBy: [],
                    media: null,
                    isAnonymous: true
                }
            ],
            contacts: [
                { id: 'user_1', name: 'Ahmet_Efe', status: 'Çevrim içi', isOnline: true },
                { id: 'user_2', name: 'Zeynep_K', status: 'Boşta', isOnline: true },
                { id: 'user_3', name: 'Mehmet99', status: 'Çevrim dışı', isOnline: false },
                { id: 'user_4', name: 'Canan_Live', status: 'Çevrim içi', isOnline: true }
            ],
            chats: JSON.parse(localStorage.getItem('wpl_chats')) || {}
        };

        // Initialize Application
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('current-username-display').innerText = currentUser;
            renderCurrentTab();
            startPrivateChatPurgeTimer();
            initPeerJS();
        });

        function saveData() {
            localStorage.setItem('wpl_posts', JSON.stringify(appData.posts));
            localStorage.setItem('wpl_chats', JSON.stringify(appData.chats));
        }

        /* -------------------------------------------------------------
           PEERJS & WEBRTC VOICE CALLING SYSTEM
           ------------------------------------------------------------- */
        function sanitizePeerId(username) {
            return 'wpl_v2_' + username.replace(/[^a-zA-Z0-9_]/g, '');
        }

        function initPeerJS() {
            peerId = sanitizePeerId(currentUser);
            
            // Clean up existing peer instance if any
            if (peer) {
                try { peer.destroy(); } catch(e){}
            }

            peer = new Peer(peerId, {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                document.getElementById('peer-status-text').innerText = "Sesli Sunucu Aktif";
                document.getElementById('peer-status-badge').className = "flex items-center space-x-1 text-[11px] bg-brand-card px-2 py-1 rounded-full border border-brand-cardBorder text-green-400";
            });

            peer.on('error', (err) => {
                console.warn("PeerJS Hatası:", err);
                document.getElementById('peer-status-text').innerText = "Çevrim içi";
            });

            // Handle Incoming Calls
            peer.on('call', (call) => {
                incomingCallData = call;
                const callerName = call.peer.replace('wpl_v2_', '');

                // Show Incoming Call Modal
                document.getElementById('voice-call-modal').classList.remove('hidden');
                document.getElementById('call-status-label').innerText = "Gelen Sesli Arama";
                document.getElementById('call-target-name').innerText = callerName;
                document.getElementById('call-timer-label').innerText = "Aranıyor...";
                
                document.getElementById('incoming-call-actions').classList.remove('hidden');
                document.getElementById('active-call-actions').classList.add('hidden');
            });
        }

        async function startVoiceCall(targetUsername) {
            if (!targetUsername) return;

            const targetPeerId = sanitizePeerId(targetUsername);

            try {
                // Get Microphone Stream
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                showToast("Mikrofon erişimi engellendi veya bulunamadı!", "warning");
                return;
            }

            // Show Outgoing Call Modal UI
            document.getElementById('voice-call-modal').classList.remove('hidden');
            document.getElementById('call-status-label').innerText = "Aranıyor...";
            document.getElementById('call-target-name').innerText = targetUsername;
            document.getElementById('call-timer-label').innerText = "Çalıyor...";
            
            document.getElementById('incoming-call-actions').classList.add('hidden');
            document.getElementById('active-call-actions').classList.remove('hidden');

            // Initiate Call via PeerJS
            currentCall = peer.call(targetPeerId, localStream);

            currentCall.on('stream', (remoteStream) => {
                attachRemoteAudioStream(remoteStream);
                startCallTimer();
            });

            currentCall.on('close', () => {
                cleanupCall();
            });

            currentCall.on('error', () => {
                showToast("Arama bağlantısı kurulamadı");
                cleanupCall();
            });
        }

        async function acceptIncomingCall() {
            if (!incomingCallData) return;

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                showToast("Mikrofona erişilemiyor!");
                rejectIncomingCall();
                return;
            }

            currentCall = incomingCallData;
            currentCall.answer(localStream);

            document.getElementById('call-status-label').innerText = "Aktif Arama";
            document.getElementById('incoming-call-actions').classList.add('hidden');
            document.getElementById('active-call-actions').classList.remove('hidden');

            currentCall.on('stream', (remoteStream) => {
                attachRemoteAudioStream(remoteStream);
                startCallTimer();
            });

            currentCall.on('close', () => {
                cleanupCall();
            });
        }

        function rejectIncomingCall() {
            if (incomingCallData) {
                incomingCallData.close();
            }
            cleanupCall();
            showToast("Arama reddedildi");
        }

        function attachRemoteAudioStream(remoteStream) {
            const audioEl = document.getElementById('remote-audio');
            audioEl.srcObject = remoteStream;
            audioEl.play().catch(e => console.log("Audio play err:", e));
        }

        function startCallTimer() {
            document.getElementById('call-status-label').innerText = "Görüşme Devam Ediyor";
            callDurationSeconds = 0;
            
            clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                callDurationSeconds++;
                const mins = Math.floor(callDurationSeconds / 60);
                const secs = callDurationSeconds % 60;
                document.getElementById('call-timer-label').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }, 1000);
        }

        function toggleMuteMic() {
            if (localStream && localStream.getAudioTracks().length > 0) {
                isMicMuted = !isMicMuted;
                localStream.getAudioTracks()[0].enabled = !isMicMuted;
                
                const muteBtn = document.getElementById('mute-mic-btn');
                if (isMicMuted) {
                    muteBtn.className = "w-12 h-12 rounded-full bg-red-600 text-white flex items-center justify-center text-lg transition-all active:scale-95";
                    muteBtn.innerHTML = `<i class="fa-solid fa-microphone-slash"></i>`;
                    showToast("Mikrofon sessize alındı");
                } else {
                    muteBtn.className = "w-12 h-12 rounded-full bg-brand-card border border-brand-cardBorder text-gray-200 hover:text-brand-orange flex items-center justify-center text-lg transition-all active:scale-95";
                    muteBtn.innerHTML = `<i class="fa-solid fa-microphone"></i>`;
                    showToast("Mikrofon açıldı");
                }
            }
        }

        function endCall() {
            if (currentCall) {
                currentCall.close();
            }
            cleanupCall();
            showToast("Arama sonlandırıldı");
        }

        function cleanupCall() {
            clearInterval(callTimerInterval);
            callDurationSeconds = 0;

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            const audioEl = document.getElementById('remote-audio');
            if (audioEl) audioEl.srcObject = null;

            currentCall = null;
            incomingCallData = null;
            isMicMuted = false;

            document.getElementById('voice-call-modal').classList.add('hidden');
        }

        /* -------------------------------------------------------------
           2-MINUTE AUTO-PURGE TIMER FOR PRIVATE MESSAGES (ONLY)
           ------------------------------------------------------------- */
        function startPrivateChatPurgeTimer() {
            setInterval(() => {
                secondsRemainingForPrivateChatPurge--;

                if (secondsRemainingForPrivateChatPurge <= 0) {
                    purgeOnlyPrivateMessages();
                    secondsRemainingForPrivateChatPurge = PRIVATE_CHAT_PURGE_INTERVAL_SECONDS;
